name: Publish snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sarto-poms-snapshot
  cancel-in-progress: false

jobs:
  publish:
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      # Every parent POM is published here; the monorepo no longer publishes copies of them.
      name: Publish the parent POMs
      goals: deploy
      fast-deploy: true
      downstream-checks: false
      sonar: false
    secrets: inherit
