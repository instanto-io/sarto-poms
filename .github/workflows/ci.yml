name: CI

on:
  pull_request:
  workflow_dispatch:

# The shared workflow asks for packages: write, and a called workflow cannot be
# granted more than its caller has.
permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify on JDK ${{ matrix.java }}
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify the POM suite on JDK ${{ matrix.java }}
      java-version: ${{ matrix.java }}
      goals: verify
      downstream-checks: false
      sonar: false
    secrets: inherit
