name: CI

on:
  push:
    branches: [main]
  pull_request:

# The shared workflow asks for packages: write, and a called workflow cannot be
# granted more than its caller has.
permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify on JDK ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify the POM suite on JDK ${{ matrix.java }}
      java-version: ${{ matrix.java }}
      # Temporary bootstrap: the cloudflare parent resolves the CDI tooling
      # jar, which is unpublished until sarto-cdi CI goes green. Install it
      # from source until then, then drop the second line.
      parents: |
        instanto-io/instanto-poms pom.xml
        cstainton/sarto-cdi sarto-cdi-teavm-tooling/pom.xml
      goals: verify
    secrets: inherit
