name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on JDK ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify the POM suite on JDK ${{ matrix.java }}
      java-version: ${{ matrix.java }}
      goals: verify
    secrets: inherit
