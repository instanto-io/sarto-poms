name: Publish snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sarto-poms-snapshot
  cancel-in-progress: false

jobs:
  publish:
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish snapshot POMs
      goals: deploy
      maven-args: -DskipTests
    secrets: inherit
